        - paragraph [ref=e76]: 라울이 단검으로 공격을 하고 있을 때 또 하나의 해골이 창으로 나를 찌르려고 했다. 유령의 말같이 무기는 사용할 수 없을지 모른다. 유적과 연관이 있는 것은 부적뿐이었다. 나는 부적으로 해골을 쳤다. 섬광이 번뜩이며 뼈가 깨지는 소리가 들리는가 했더니 해골은 갈래갈래 깨졌다. 나는 안도의 한숨을 내쉬었다.
        - paragraph [ref=e77]: 다음에 문이 있는 방으로 들어갔다. 문의 양쪽에는 원주의 대좌가 있고 왼쪽의 대좌에는 뼈를 담는 사기가 놓여 있었다. 그것을 우측의 대좌에 옮기자 “딱” 하는 소리와 함께 원주가 약간 움직이더니 곧바로 가운데 문이 열렸다. 우리들이 밖에 나오자마자 문은 닫혀 버렸다. 거기는 신전의 밖이었고 앞에는 우리들의 지프가 보였다. 지프로 돌아가 나는 정제가 든 병 이외의 것을 모두 지프백에 던졌다. 지프를 남동쪽으로 몰고 가다가 석상이 있는 곳에서 라울은 지프를 세웠다. “이것은 아즈테크의 신 테스카토리포카의 상입니다. 페레스 교수는 이 숭배에 대해서 조사하고 계셨읍니다.”
        - paragraph [ref=e78]:
          - text: 나는 지프에서 내린 다음 정제를 먹었다. 그리고 머리가 몸체에서 떨어진 상을 조사하기 시작했다. 아즈테크 문자가 상의 가슴에 새겨져 있었다. 라울은 그것을 해독했다.
          - code [ref=e79]: XOTZIL
          - text: . 나는 떨어진 머리를 몸체 위에 올렸다. 머리는 마치 살아 있는 것처럼 따뜻했다. 머리가 몸체와 붙으니까 상은 흔들리기 시작했다. 우리가 도망을 치자 상은 파란 눈의 표범이 됐다. 표범은 잠시 가만히 있다가 정글 속으로 사라져 버렸다.
