        - paragraph [ref=e125]: “무슨 말을 했는지 대답해라.” 나는 잠시 생각했다. “석관(石棺)이다.” 내가 대답하니까 거대한 얼굴은 사라졌다. 나는 3개의 그릇에 그려져 있는 지도를 보고 출구로 향했다. 파괴된 방으로 도착했다. 마루는 많이 흔들리고 있어 오래 있으면 위험하다. 나는 부서지기 전에 방을 빠져나왔다. 계속 턴널이 이어졌다. 출구를 찾지 못하여 마치 미로를 헤매고 있는 것 같았다. 같은 곳을 몇 번씩 다시 지나가고 있는 듯했다. 신전의 출구를 찾았을 때와 같이 가면을 쓴 채로 나아갔다. 이 미로에 들어와서 11인가 12번째의 분기점이었다. 가면을 쓰고 앞으로 가니 넓은 방에 도착했다. 나 이외의 누군가가 있는 듯했다. 갑자기 기둥 뒤에서 프란시스코 로보프가 다가와서 대구경의 권총을 나에게 들이댔다.
        - paragraph [ref=e126]: “아이고! 또 만났구나.” “우리 둘이서 찾던 그것을 당신이 가지고 있는 것은 알고 있다. 가면이다. 참 잘됐다. 나는 여기 미로를 며칠인가 물도 식량도 없이 돌아다녔다. 출구는 없는 것같이 보이지만 가면만 있으면 출구를 찾을 수 있다. 당신은 내가 필요로 하는 물건을 가지고 있다. 그 가면이야. 스틸군.” 로보프는 나에게 총을 들이대며 가면을 요구했다. 로보프는 아주 급한 것 같았다. 나는 신변의 위험을 느껴 태양의 가면을 주었다.
        - paragraph [ref=e127]: “당신은 똑똑한 사람이다. 스틸군. 드디어 가졌다.” 로보프는 가면을 손에 쥐고 얼굴을 댔다. 갑자기 태양의 신의 목소리가 통로를 통해서 울려 퍼졌다. “사람이여 너는 가면을 너무 썼다. 그 죄로 죽어야만 한다.” 나는 뒤에서 괴음을 들었다. 기둥 뒤에서 파란 눈의 표범이 로보프에게 덤벼들었다. 로보프는 권총을 몇 발이나 쏘았지만 표범에게는 효과가 없었다. 로보프를 죽인 표범은 나에게 덤벼들 자세를 취하고 쳐다보았다. 어떻게 하면 좋은가. 「음악은 잔인함을 녹여준다…」 나는 노파의 말을 상기하고 플롯을 불었다. 플롯의 음은 표범의 잔인함을 녹여준 것 같았다. 표범은 잠시 플롯 소리를 듣더니 기둥 뒤로 걸어가 사라졌다. 잠시 잠잠하더니 태양의 신 목소리가 들렸다. “가시오. 인간이여, 이번에는 너에게 해를 주지 않겠다. 그러나 다시 되돌아오면 너는 죽을 것이다.” 나는 굉장한 두려움을 느꼈다. 그리고 이 방이 조금씩 밝아져 왔다. 주위를 보니 신전 밖에 나와 있었다. 신전의 그림자 위로 저녁 해가 저무는 아름다운 광경이 눈에 들었다. 나의 모험은 끝난 것이다.
