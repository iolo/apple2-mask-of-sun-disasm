        - paragraph [ref=e33]: 고대 중앙아메리카에 「태양의 나라」가 있었다. 수도인 테노치티토란에는 거대한 피라미드나 태양의 신전이 줄지어 있었고, 인구는 30만 정도였다. 사람들은 수많은 인신어공(人身御供)을 신(태양)에게 바치는 여러 가지 주술의 제사를 지냈다. 이것이 아즈테크 제국이다. 그러나 「갈대해(一葦年)」에 스페인에게 공격받아 한순간에 그 문명은 영원히 수수께끼로 묻혀 버렸다.
        - paragraph [ref=e34]: (講談社 [총서명 판독 불명] 「아즈테크 문명의 수수께끼」 高山智博著에서 인용)
        - heading "게임 진행을 위한 「태양의 가면」 줄거리" [level=3] [ref=e35]
        - paragraph [ref=e36]: 이 「태양의 가면」 줄거리는 게임 진행 과정을 나타낸 것이다. 화면에 나오는 자막과 이 줄거리를 비교해 보면서 게임을 진행하면 쉽고 재미있게 게임을 즐길 수 있을 것이다.
        - paragraph [ref=e37]: 나의 이름은 맥 스틸(MAC STEAL), 직업은 고고학자이며 모험가이자 보물수집가이다. 태양의 가면을 찾기 시작하게 된 것은 티벳에 있을 때였다. 내가 라사(티벳의 수도)의 수도원에서 발견한 족자를 동료인 프란시스코 로보프에게 도둑을 맞았다. 그래서 나도 그가 이전에 발굴하여 소유하고 있던 「부적」을 훔쳐 버렸다. 그 후 나는 보스톤 대학에 돌아가 새로운 발굴조사를 시작하고 로보프와의 관계를 청산하려고 결심을 했다. 세심한 조사 결과 부적은 전설과 민화 속의 중부 멕시코에서 만들어진 것으로 판명됐다. 로보프가 어떻게 해서 이것을 손에 쥐었는지 매우 호기심이 나 조사해 보니 전설상 흥미 있는 것과 연결되었다. 그것은 태양의 가면이었다. 나는 지금까지 가면에 대해서 수집한 정보를 정리해 보았다.
        - blockquote [ref=e38]:
          - paragraph [ref=e39]: 그것은 금으로 되어 있고 몸에 부착하면 부적이 되지만 지나치게 쓰면 자신의 파멸을 초래한다.
        - paragraph [ref=e40]: 그러나 그것은 신화에 지나지 않는다. 부적에 매료당한 나는 그것에 담겨져 있는 것을 알려고 시도했다. 약간 깨진 곳을 조사할 때 너무나 작게 닫혀진 곳을 열어버리는 바람에 엷은 녹색 까스가 뿜어 나와 나는 의식을 잃었다. 의식이 돌아왔을 때 나는 대학병원의 병실에 누워 있었다. 나는 이틀간이나 의식을 잃고 있었다. 의사들은 원인불명의 병에 당황하여 치료를 못하고 있었다.
        - paragraph [ref=e41]: 의사는 내가 발작을 일으켰을 때에 일시적으로 발작을 억제시키는 해독제를 조제했다. 의사는 그 약이 나의 생명을 유지시켜 주는 것이니 규칙대로 복용하라고 경고했다. 나는 정력적으로 부적을 조사하기 위해서 사무실로 돌아갔다. (부적에 의해서 쇠약해진 육체의 치료법을 찾기 위해서) 가면에 대한 무서운 비밀이나 장소 등을 기재한 문헌의 관련기사는 불명확한 것뿐이었다. 태양의 가면만이 나에 대한 저주를 알고 있다. 산체스에 있는 멕시코대학의 페레스 교수로부터 전보를 받을 때까지 나는 가면이 있는 곳을 찾을 수가 없었다. 그것을 내가 보낸 수많은 전보 중 부적에 대한 자세한 정보를 제공한 것이었다.
        - paragraph [ref=e42]: 교수는 대학에서 지도를 가지고 와서 몇 개의 아즈테크 유적의 부적이나 가면에 대해서 가르쳐 주었다. 나는 태양의 가면이 있을 듯한 장소 가까이의 비행기장에 있다고 하는 페레스 교수를 만나기 위해서 중부 멕시코로 출발했다. 내 자신을 위한 모험이 시작되었다. 태양의 가면에 대한 생각 때문에 나는 한때 번창했던 이 아스테크 문명의 땅, 멕시코로 오게 되었다. 멕시코시티에서 빌린 비행기는 페레스 교수가 말하던 유적 근처의 작은 비행장에 도착했다. 낡아빠진 활주로에 서 있는 2개의 그림자가 보였다. 나는 비행기에서 내려 두 남자에게 다가갔다. 페레스 교수와 젊은 남자가 지프 옆에서 기다리고 있었다.
        - paragraph [ref=e43]: “당신에게 전설의 가면이 있다고 생각되는 3곳을 표시한 지도를 드리겠읍니다. 필요한 것은 모두 지프 속에 있읍니다. 나의 제자인 라울군이 동행할 것입니다. 그의 고대언어에 관한 지식에는 놀랄 것입니다. 당신이 가면의 수수께끼를 알아내길 바랍니다. 자! 지프에 타시죠, 선생님.” 나는 교수로부터 지도를 받자 라울과 함께 지프에 탔다. “안녕히 계십시오.” 교수는 그렇게 말하고 비행기 쪽으로 갔다. “북쪽으로 가면 유적지로 갈 수 있읍니다.”
        - paragraph [ref=e44]: 라울은 지프를 출발시켰다. 지프는 먼지를 일으키며 달렸다. 갈림길에 도달했을 때 라울은 지프를 세웠다. “어느 쪽으로 가겠읍니까 선생님?” “서쪽으로.” 길옆에 오래된 작은 집이 있었고 안에서 무언가 알 수 없는 악기 소리가 들려왔다. 지프에서 내려서 집 속으로 들어갔다. 안에는 노파가 혼자 플롯을 불고 있었다. 노파는 우리들을 보고 “가난하고 배고픈 이 노파를 도와주세요. 친절한 분에게는 항상 신의 은총이 있어요.” 나는 가지고 있던 먹을 것을 노파에게 주었다.
        - paragraph [ref=e45]: “대신 이 플롯을 가지고 가세요. 언젠가 꼭 필요할 때가 있을 테니까. 음악은 잔인한 동물의 성질을 온순하게 해 줍니다. 꼭 기억하세요.” 노파는 그렇게 말을 하고는 어디론가 사라졌다. 지프에 돌아가 좀 전에 갔었던 갈림길에서 다시 북서로 향했다.
