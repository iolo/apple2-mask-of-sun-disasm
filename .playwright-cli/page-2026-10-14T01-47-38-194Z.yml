        - paragraph [ref=e55]: 갑자기 라울은 지프를 세웠다. “선생님 정글을 보세요. 지도에 있던 유적 중의 하나입니다.” 지프를 다시 운전해 가면서 유적 근처까지 왔지만 길이 좁아 거기서부터는 걸어가야만 했다. 우리들은 신전 아래까지 왔다. 신전의 계단은 가파르기 때문에 조심조심 올라갔다. 정상에는 내부로 통하는 입구가 있었다. 그것은 회색의 화산암에 아스테크조의 조각이 새겨져 있었다. 입구는 7피트 정도 높이였고 마루는 헐려 있었다. 나는 램프를 켰다. 두 사람이 신전 안으로 들어서자 뒤에서 문이 닫혔다. 그리고 무언가가 우리들의 앞에서 활활 타는 소리가 나더니 갑자기 거대한 뱀이 우리들 앞에 모습을 드러냈다. 나는 권총을 꺼내 큰뱀을 향해서 방아쇠를 당겼다. 뱀은 총을 맞아 몸을 끌면서 도망갔다.
        - paragraph [ref=e56]: 주위를 살펴보니 조금 높은 나무가 있었고 두 개의 출구가 있었다. 나는 그것을 자세히 살펴보았다. 그 벽에 작은 금이 있는 것을 발견했다. 금이 간 부분을 살짝 밀자 끼익 소리를 내면서 문이 열렸다. 그 저쪽으로는 중앙에 높은 단이 있었고, 그 위에는 화려한 수정의 그릇이 놓인 대좌가 있었다. 내가 그 수정 그릇을 들어 올렸을 때 방바닥이 내려가는 것 같았다. 거기는 지하통로와 연결되어 있었다. 턴널의 분기에서 오른쪽으로 가니 지하묘소가 나왔다. 그곳에 아즈테크조로 만든 세 개의 관이 놓여 있었다. 나는 관 속을 들여다보고 싶은 충동이 생겨 관을 열려고 했지만 두 개의 관은 꼼짝도 하지 않았다. 라울의 도움으로 세 번째 관 뚜껑을 열 수 있었다. 그때 나는 영기(靈氣)를 느꼈다. 갑자기 유령이 나타났다. 고노찬 유령이 말하기 시작했다.
        - blockquote [ref=e57]:
          - paragraph [ref=e58]: “아직 살아 있는 후견인들이여. 무기는 그들을 해치는 데는 아무런 도움이 못 된다. 태양의 힘이 강한 자만이 그들을 이길 수가 있다.”
        - paragraph [ref=e59]: 그렇게 말한 뒤 유령은 사라졌다. 뒤에는 비싼 그릇이 놓여 있었다. 턴널로 들어가 헤매고 있던 중 양편에서 해골의 전사가 지키고 있는 제단이 있는 방으로 들어가게 되었다. 제단 위에 놓여진 은제의 그릇을 들려고 하자 라울이 외쳤다. “보세요, 선생님! 해골이 움직이고 있다.”
